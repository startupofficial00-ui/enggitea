</main><footer class="footer">

</footer><!-- Supabase --><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script>

document.addEventListener("DOMContentLoaded", async () => {

    const container =
        document.querySelector("#myResourcesContainer");


    try {

        /* --------------------------------
           CHECK LOGIN
        -------------------------------- */

        const {
            data: { user },
            error: authError
        } = await supabaseClient.auth.getUser();


        if (authError || !user) {

            window.location.href =
                "login.html";

            return;

        }



        /* --------------------------------
           LOAD USER'S RESOURCES
        -------------------------------- */

        const {
            data: resources,
            error
        } = await supabaseClient

            .from("resources")

            .select("*")

            .eq("uploaded_by", user.id)

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


        if (error) {

            console.error(
                "Supabase error:",
                error
            );

            throw error;

        }



        /* --------------------------------
           NO RESOURCES
        -------------------------------- */

        if (
            !resources ||
            resources.length === 0
        ) {

            container.innerHTML = `

                <div class="empty-state">

                    <h3>
                        No Resources Yet
                    </h3>

                    <p>
                        You haven't uploaded any resources.
                    </p>

                    <br>

                    <a
                        href="upload.html"
                        class="btn btn-primary"
                    >
                        Upload Resource
                    </a>

                </div>

            `;

            return;

        }



        /* --------------------------------
           DISPLAY RESOURCES
        -------------------------------- */

        container.innerHTML = `

            <div class="resource-grid">

                ${resources
                    .map(myResourceCard)
                    .join("")}

            </div>

        `;



        /* --------------------------------
           DELETE BUTTONS
        -------------------------------- */

        document
            .querySelectorAll(".delete-resource")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    handleDeleteResource
                );

            });


    } catch (error) {

        console.error(
            "Unable to load resources:",
            error
        );


        container.innerHTML = `

            <div class="alert alert-error">

                Unable to load your resources.

                <br><br>

                Please try again.

            </div>

        `;

    }

});



/* =====================================
   RESOURCE CARD
===================================== */

function myResourceCard(resource) {

    const id =
        resource.id;


    const title =
        resource.title ||
        "Untitled Resource";


    const type =
        resource.resource_type ||
        "Resource";


    const status =
        resource.status ||
        "pending";


    return `

        <article class="resource-card">


            <span class="resource-type">

                ${escapeHTML(type)}

            </span>


            <h3>

                ${escapeHTML(title)}

            </h3>


            <p>

                Status:

                <strong>

                    ${escapeHTML(status)}

                </strong>

            </p>


            <div class="resource-actions">


                <a
                    href="resource.html?id=${encodeURIComponent(id)}"
                    class="btn btn-primary btn-sm"
                >
                    View
                </a>


                <button
                    type="button"
                    class="btn btn-danger btn-sm delete-resource"
                    data-id="${escapeHTML(id)}"
                >
                    Delete
                </button>


            </div>


        </article>

    `;

}



/* =====================================
   DELETE RESOURCE
===================================== */

async function handleDeleteResource(event) {

    const button =
        event.currentTarget;


    const id =
        button.dataset.id;


    if (!id) {

        alert(
            "Resource ID not found."
        );

        return;

    }



    const confirmed =
        confirm(
            "Are you sure you want to delete this resource?"
        );


    if (!confirmed) {

        return;

    }



    button.disabled = true;

    button.textContent =
        "Deleting...";



    try {


        /* -----------------------------
           GET CURRENT USER
        ----------------------------- */

        const {
            data: { user },
            error: authError
        } = await supabaseClient.auth.getUser();


        if (authError || !user) {

            window.location.href =
                "login.html";

            return;

        }



        /* -----------------------------
           DELETE ONLY OWN RESOURCE
        ----------------------------- */

        const {
            error
        } = await supabaseClient

            .from("resources")

            .delete()

            .eq("id", id)

            .eq("uploaded_by", user.id);


        if (error) {

            console.error(
                "Delete error:",
                error
            );

            throw error;

        }



        /* -----------------------------
           RELOAD PAGE
        ----------------------------- */

        window.location.reload();


    } catch (error) {

        console.error(
            "Unable to delete resource:",
            error
        );


        alert(
            error.message ||
            "Unable to delete resource."
        );


        button.disabled = false;

        button.textContent =
            "Delete";

    }

}



/* =====================================
   HTML ESCAPE
===================================== */

function escapeHTML(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}
