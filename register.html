<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Register | Enggii Tea</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="nav-inner">

        <a href="index.html" class="logo">
            ENGGII TEA
            <small>Engineering Mathematics</small>
        </a>

        <button class="menu-btn">☰</button>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>

    </div>

</header>

<main class="auth-wrapper">

    <section class="auth-card">

        <h1>Create Account</h1>

        <p>
            Join Enggii Tea and start learning smarter.
        </p>

        <div
            id="registerMessage"
            class="alert"
            style="display:none;"
        ></div>

        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    class="form-control"
                    placeholder="Enter your name"
                    required
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    class="form-control"
                    placeholder="Confirm your password"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-primary"
                style="width:100%;"
            >
                Create Account
            </button>

        </form>

        <p style="margin-top:20px;text-align:center;">

            Already have an account?

            <a
                href="login.html"
                style="color:var(--primary);font-weight:700;"
            >
                Login
            </a>

        </p>

    </section>

</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
