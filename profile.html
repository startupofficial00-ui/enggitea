</footer><!-- SUPABASE --><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script>

document.addEventListener(
    "DOMContentLoaded",
    loadProfile
);


async function loadProfile() {

    try {

        /* =========================
           GET CURRENT USER
           ========================= */

        const {
            data: {
                user
            },
            error
        } = await supabaseClient.auth.getUser();


        /* =========================
           NOT LOGGED IN
           ========================= */

        if (
            error ||
            !user
        ) {

            window.location.href =
                "login.html";

            return;

        }


        /* =========================
           USER INFORMATION
           ========================= */

        const email =
            user.email ||
            "—";


        const name =
            user.user_metadata?.name ||
            user.user_metadata?.full_name ||
            user.user_metadata?.username ||
            "Student";


        /* =========================
           ROLE
           ========================= */

        const role =
            user.user_metadata?.role ||
            "student";


        /* =========================
           DISPLAY PROFILE
           ========================= */

        document.getElementById(
            "profileName"
        ).textContent =
            name;


        document.getElementById(
            "profileEmail"
        ).textContent =
            email;


        document.getElementById(
            "nameValue"
        ).textContent =
            name;


        document.getElementById(
            "emailValue"
        ).textContent =
            email;


        document.getElementById(
            "roleValue"
        ).textContent =
            role.charAt(0).toUpperCase() +
            role.slice(1);


        /* =========================
           AVATAR
           ========================= */

        document.getElementById(
            "avatar"
        ).textContent =
            name
                .charAt(0)
                .toUpperCase();


        /* =========================
           LOGOUT
           ========================= */

        document
            .getElementById(
                "logoutProfile"
            )
            .addEventListener(
                "click",
                logout
            );


    } catch (error) {

        console.error(
            "Profile loading error:",
            error
        );

        window.location.href =
            "login.html";

    }

}



/* =========================
   LOGOUT
   ========================= */

async function logout() {

    const {
        error
    } = await supabaseClient.auth.signOut();


    if (error) {

        alert(
            "Logout failed. Please try again."
        );

        console.error(error);

        return;

    }


    window.location.href =
        "login.html";

}

</script></body></html>
